org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties
mod_version = 1.1.0
maven_group = com.jcwd.notebook
archives_base_name = notebook

# Loader / Loom (same for every Minecraft version)
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# --- Minecraft target: the default build is 26.1.x ---
# 26.2 / 26.3 jar:  ./gradlew build -Pminecraft_version=26.2 -Pfabric_version=0.161.0+26.2 -Pcompat=mc26_2 -Pmc_range=">=26.2 <26.4"
minecraft_version=26.1
fabric_version=0.145.1+26.1
# Which src/compat/<name> folder supplies the version-specific Minecraft calls
compat=mc26_1
# Minecraft versions written into fabric.mod.json
mc_range=>=26.1 <26.2
